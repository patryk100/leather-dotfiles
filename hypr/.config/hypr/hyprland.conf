# =============================================================================
#  MINIMAL HYPRLAND CONFIG (NO RICE, JUST SPEED)
# =============================================================================

# Exec section
exec-once = ~/.config/hypr/scripts/random_border.sh
exec-once = sleep 2 && waybar
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=systemctl --user restart xdg-desktop-portal.service
exec-once=sleep 1 && xdg-desktop-portal-hyprland
# --- CLIPBOARD ---
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store

# --- MONITOR ---
# Auto-detect monitor. 
# Tip: If you have a high-refresh monitor, set it manually like:
# monitor=DP-1, 2560x1440@144, 0x0, 1
monitor=,preferred,auto,1

# --- CORE APPS ---
$terminal = foot
$menu = wofi --show drun --allow-images
env = QML_IMPORT_PATH,/usr/local/lib64/qt6/qml

# --- LOOK AND FEEL ---

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    
    # Gradient border: Blue to Green
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    
    layout = dwindle
}

decoration {
    rounding = 10
    
    # Slight transparency makes it feel more modern
    active_opacity = 1.0
    inactive_opacity = 0.9

    # New Shadow Syntax (Fixes your error)
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # Glass effect
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    # A custom curve for "snappy" movement
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

misc {
    # OPTIMIZATION: Variable Frame Rate (Lowers power usage when screen is static)
    vfr = true 
    
    # OPTIMIZATION: Disable default anime wallpapers/logos
    disable_hyprland_logo = true 
    disable_splash_rendering = true
}

input {
    kb_layout = us
    follow_mouse = 1
    kb_options = ctrl:nocaps    
    # OPTIMIZATION: Raw input for mouse (no acceleration)
    accel_profile = flat
    sensitivity = 0 
}

# --- WINDOW RULES ---
# Prevent these from tiling (they break usage if tiled)
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
# Your specific request: OBS floats and centers


# --- KEYBINDINGS (VIM STYLE) ---
$mainMod = SUPER

# --- SCREENSHOTS & CLIPBOARD ---

# 1. Super+P: Instant Screenshot to Clipboard (Best for Obsidian)
# Action: Select area -> Image is in clipboard -> Paste into Obsidian (Ctrl+V)
bind = $mainMod, P, exec, grim -g "$(slurp)" - | wl-copy

# 2. Super+Shift+P: Edit Screenshot before copying
# Action: Select area -> Swappy opens -> Draw arrows/box -> Ctrl+C to copy
bind = $mainMod SHIFT, P, exec, grim -g "$(slurp)" - | swappy -f -

# 3. Super+Shift+V: Open Clipboard History
# Action: Shows list of text/images you copied previously -> Click to restore
bind = $mainMod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy


# System
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating, 
# Brightness Control (External Monitor) using Super + Arrow Keys
binde = SUPER, Up, exec, ddcutil setvcp 10 + 10
binde = SUPER, Down, exec, ddcutil setvcp 10 - 10
# Shortcuts
bind = $mainMod, W, exec, firefox
bind = $mainMod, E, exec, flatpak run md.obsidian.Obsidian
bind = $mainMod, R, exec, obs
bind = $mainMod, T, exec, okular

# Vim Navigation (HJKL)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Vim Movement (Shift + HJKL moves the window itself)
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Special Workspace (Scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Workspaces 1-5
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# colors
bind = $mainMod, B, exec, ~/.config/hypr/scripts/random_border.sh

# Move active window to workspace 1-5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
