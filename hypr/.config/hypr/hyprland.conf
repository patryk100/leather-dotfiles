# --- 1. NVIDIA & WAYLAND ENVIRONMENT ---
# Essential for RTX 3070 stability and Waybar initialization
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = ELECTRON_OZONE_PLATFORM_HINT,auto # Fixes Obsidian/Firefox flickering
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct 
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

cursor {
    no_hardware_cursors = true # Prevents cursor ghosting on NVIDIA
}

# --- 2. STARTUP (ORDER MATTERS) ---
# Ensure portals and DBUS are ready before the bar and apps launch
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user restart xdg-desktop-portal.service
exec-once = sleep 1 && waybar
exec-once = ~/.config/hypr/scripts/random_border.sh
exec-once = hyprpaper
exec-once = mako
# --- Tray applets (GNOME-style system indicators) ---
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = swaync  # notification center — swipe-down notifications
# Clipboard management
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store

# --- 3. MONITOR CONFIG ---
# Arlington Station: DP-2 is likely your primary ROG monitor
monitor=,preferred,auto,1


# --- 4. CORE APPS & VARIABLES ---
$terminal = foot
$menu = wofi --show drun --allow-images
$mainMod = SUPER

# --- 5. LOOK AND FEEL ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 5
        passes = 2 # Higher passes for better glass effect
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier # Snappier timing (5 vs 7)
    animation = workspaces, 1, 4, default
}

misc {
    vfr = true # Saves GPU cycles on static screens
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

input {
    kb_layout = us
    kb_options = ctrl:nocaps # The essential engineer layout
    follow_mouse = 1
    accel_profile = flat # Raw mouse input for precision
    sensitivity = 0 
}

# --- 6. WINDOW RULES (GNOME-STYLE POPUPS) ---
# This forces the quick-settings apps to float and center like GNOME widgets
# windowrulev2 = float, class:^(pavucontrol|nm-connection-editor|blueman-manager)$
# windowrulev2 = size 700 500, class:^(pavucontrol|nm-connection-editor|blueman-manager)$
# windowrulev2 = center, class:^(pavucontrol|nm-connection-editor|blueman-manager)$
# windowrulev2 = pin, class:^(pavucontrol|nm-connection-editor|blueman-manager)$
#
# # Floating rules for tools
# windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)$
# windowrulev2 = float, title:^(Volume Control)

# No gaps or borders if only one window is open
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# --- 6. WINDOW RULES (GNOME-STYLE POPUPS) ---
# Float + size + position: apps feel like bar popovers

# Audio control popover
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol|pavucontrol)$
windowrulev2 = size 480 600, class:^(org.pulseaudio.pavucontrol|pavucontrol)$
windowrulev2 = move 100%-490 46, class:^(org.pulseaudio.pavucontrol|pavucontrol)$

# Network editor popover
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = size 600 500, class:^(nm-connection-editor)$
windowrulev2 = move 100%-610 46, class:^(nm-connection-editor)$

# Bluetooth popover (overskride or blueberry)
windowrulev2 = float, class:^(io.github.kaii_lb.Overskride|blueberry.py|blueman-manager)$
windowrulev2 = size 500 600, class:^(io.github.kaii_lb.Overskride|blueberry.py|blueman-manager)$
windowrulev2 = move 100%-510 46, class:^(io.github.kaii_lb.Overskride|blueberry.py|blueman-manager)$

# Calendar popover
windowrulev2 = float, class:^(org.gnome.Calendar)$
windowrulev2 = size 700 550, class:^(org.gnome.Calendar)$
windowrulev2 = move 50%-350 46, class:^(org.gnome.Calendar)$

# Unified styling for all popovers
windowrulev2 = rounding 12, floating:1
windowrulev2 = dimaround, class:^(pavucontrol|nm-connection-editor|overskride|blueberry.py|org.gnome.Calendar)$

# --- 7. KEYBINDINGS ---

# F8: Start (Switching extension to .mkv for resilience)
bind = $mainMod, F8, exec, notify-send "Recording" "Started (MKV)..." && gpu-screen-recorder -w screen -f 60 -a default_output -o ~/Videos/recording_$(date +%Y-%m-%d_%H-%M-%S).mkv

# F9: Stop (Same signal, but MKV won't care if it's slightly abrupt)
bind = $mainMod, F9, exec, pkill -INT gpu-screen-recorder && notify-send "Recording" "Saved to ~/Videos/"
# System Binds
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive, 
bind = $mainMod, M, exit, # Logout
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating, 
bind = $mainMod, L, exec, wlogout # Unified Power Menu

# --- WLOGOUT RULES ---
# This ensures the background blurs when the menu is open
layerrule = blur, logout_dialog
layerrule = ignorealpha 0.5, logout_dialog

# If you want it to launch with a keybind
bind = $mainMod, Escape, exec, wlogout -b 2 # -b 2 tells it to show 2 columns
bind = $mainMod, B, exec, ~/.config/hypr/scripts/random_border.sh
# Apps
bind = $mainMod, W, exec, firefox
bind = $mainMod, E, exec, flatpak run md.obsidian.Obsidian
bind = $mainMod, R, exec, obs
bind = $mainMod, T, exec, okular

# Screenshots (Ironman training logs / BU Research)
bind = $mainMod, P, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, P, exec, grim -g "$(slurp)" "$HOME/Pictures/$(date +'%Y-%m-%d_%H%M%S').png"
bind = $mainMod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Navigation (Vim HJKL)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Movement (Shift + HJKL)
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Monitor Brightness (ddcutil)
bind = SUPER, Up, exec, ddcutil setvcp 10 + 10
bind = SUPER, Down, exec, ddcutil setvcp 10 - 10

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move to Workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Scratchpad (Special Workspace)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
