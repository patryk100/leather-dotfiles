# ============================================================================
#  Foot terminal — Catppuccin (Mocha + Latte)
#
#  Updated for foot 1.24+:
#   - [colors] is deprecated; use [colors-dark] / [colors-light]
#   - [colors2] is also deprecated; use [colors-light]
#   - alpha lives inside the per-theme color block, not a separate [colors]
#
#  Toggle between dark and light at runtime with Ctrl+Shift+T (bound below),
#  or send SIGUSR1 / SIGUSR2 to the foot process.
# ============================================================================

[main]
font = HackNerdFont:size=11
# Optional bold/italic variants — uncomment to use a different face for each.
# font-bold   = HackNerdFont:weight=bold:size=11
# font-italic = HackNerdFont:slant=italic:size=11
# font-bold-italic = HackNerdFont:weight=bold:slant=italic:size=11

shell = /usr/bin/zsh

# Inner padding around the text grid (pixels). Format is LEFTxTOP or
# LEFTxTOPxRIGHTxBOTTOM. Looks much nicer than the default flush-to-edge.
pad = 8x8

# Use sub-pixel positioning where the compositor supports fractional scaling.
dpi-aware = yes

# Default startup window size in characters. Comment out to use foot's
# default of 700x500 pixels.
initial-window-size-chars = 110x32

# Don't bind to the terminal's TERM=foot if you SSH a lot to systems that
# don't have foot's terminfo installed; xterm-256color is a safe fallback.
# term = xterm-256color


[scrollback]
lines = 10000
# Mouse wheel multiplier (default 3.0). Higher = faster scrolling.
multiplier = 3.0
# Show a small "scrolled back N lines" indicator in the corner.
indicator-position = relative
indicator-format = line


[bell]
# Raise urgency hint when the terminal bell rings (waybar/hyprland can
# pick this up to highlight the window). Other options: notify, visual,
# command, command-focused.
urgent = yes


[cursor]
style = beam
blink = yes
# Cursor color is now set per-theme inside [colors-dark] / [colors-light]
# (the old `[cursor].color` was deprecated in foot 1.23).
beam-thickness = 1.5


[mouse]
# Auto-hide the cursor while you're typing; reappears on movement.
hide-when-typing = yes


[url]
# Foot detects URLs automatically. Ctrl+Shift+O enters URL-launch mode:
# every visible URL gets a letter label; press the letter to open it.
launch = xdg-open ${url}
# Letters used for URL jump labels (home-row friendly).
label-letters = sadfjklewcmpgh


# ============================================================================
#  COLORS — DARK (Catppuccin Mocha)
# ============================================================================
[colors-dark]
alpha      = 0.96
background = 1e1e2e
foreground = cdd6f4

# Cursor: text-color cursor-color (RRGGBB pair).
cursor = 1e1e2e cdd6f4

# Selection highlight (foreground = text color, background = highlight color).
selection-foreground = 1e1e2e
selection-background = f5e0dc

# URL underline color in launch/copy modes.
urls = 89b4fa

# In-terminal search box (scrollback search via Ctrl+Shift+R).
search-box-no-match = 11111b f38ba8
search-box-match    = 11111b a6e3a1

# Jump-label colors (the letters that appear over URLs in URL mode).
jump-labels = 1e1e2e f9e2af

# Normal palette (0–7)
regular0 = 45475a
regular1 = f38ba8
regular2 = a6e3a1
regular3 = f9e2af
regular4 = 89b4fa
regular5 = f5c2e7
regular6 = 94e2d5
regular7 = bac2de

# Bright palette (8–15)
bright0 = 585b70
bright1 = f38ba8
bright2 = a6e3a1
bright3 = f9e2af
bright4 = 89b4fa
bright5 = f5c2e7
bright6 = 94e2d5
bright7 = a6adc8


# ============================================================================
#  COLORS — LIGHT (Catppuccin Latte)
#  Toggle to this theme with Ctrl+Shift+T.
# ============================================================================
[colors-light]
alpha      = 0.98
background = eff1f5
foreground = 4c4f69

cursor = eff1f5 4c4f69

selection-foreground = eff1f5
selection-background = dc8a78

urls = 1e66f5

search-box-no-match = ccd0da d20f39
search-box-match    = ccd0da 40a02b

jump-labels = eff1f5 df8e1d

regular0 = 5c5f77
regular1 = d20f39
regular2 = 40a02b
regular3 = df8e1d
regular4 = 1e66f5
regular5 = ea76cb
regular6 = 179299
regular7 = acb0be

bright0 = 6c6f85
bright1 = d20f39
bright2 = 40a02b
bright3 = df8e1d
bright4 = 1e66f5
bright5 = ea76cb
bright6 = 179299
bright7 = bcc0cc


# ============================================================================
#  KEY BINDINGS
#  Most defaults are already great. Only non-default binds are set here.
#  See `man 5 foot.ini` for the full list.
# ============================================================================
[key-bindings]
# Theme switching — these have no default binding.
color-theme-toggle = Control+Shift+t

# The following are foot's defaults; listed as comments for discoverability.
# search-start       = Control+Shift+r
# show-urls-launch   = Control+Shift+o
# show-urls-copy     = Control+Shift+u
# spawn-terminal     = Control+Shift+n
# font-size-up       = Control+plus  Control+equal  Control+KP_Add
# font-size-down     = Control+minus Control+KP_Subtract
# font-size-reset    = Control+0     Control+KP_0
# clipboard-copy     = Control+Shift+c
# clipboard-paste    = Control+Shift+v
# scrollback-up-page = Shift+Page_Up
# scrollback-down-page = Shift+Page_Down
